<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookStore</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- NAV -->
  <nav class="nav">
    <div class="nav-inner">
      <div class="nav-brand" onclick="goHome()">📚 BookStore</div>
      <div class="nav-links">
        <button class="nav-btn" onclick="goHome()">Home</button>
        <button class="nav-btn cart-btn" onclick="goCart()">
          🛒 Cart <span class="badge" id="cart-count">0</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- HOME PAGE -->
  <div class="page active" data-page="home">
    <div class="hero">
      <h1>Welcome to <span>BookStore</span></h1>
      <p>Find your next favourite book</p>
      <div class="search-wrap">
        <input id="search-input" class="search-input" type="text" placeholder="Search by title or author...">
        <button class="btn-search" onclick="doSearch()">Search</button>
      </div>
    </div>
    <div class="books-section">
      <div class="section-title" id="section-title">All Books</div>
      <div class="books-grid" id="books-grid">
        <div class="loader"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <!-- DETAIL PAGE -->
  <div class="page" data-page="detail">
    <div class="detail-page">
      <div class="detail-back" onclick="goHome()">← Back to Books</div>
      <div id="detail-content">
        <div class="loader"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <!-- CART PAGE -->
  <div class="page" data-page="cart">
    <div class="cart-page">
      <h2>🛒 Your Cart</h2>
      <div id="cart-content"></div>
    </div>
  </div>

  <!-- CONFIRMATION PAGE -->
  <div class="page" data-page="confirm">
    <div class="confirm-page">
      <div id="confirm-content"></div>
    </div>
  </div>

  <footer>
    <p>© 2025 BookStore — Built with Spring MVC + Java</p>
  </footer>

  <div id="toast"></div>
  <script src="/js/app.js"></script>
</body>
</html>
